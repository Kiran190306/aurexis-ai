services:
  # Frontend Web Service
  - type: web
    name: aurexis-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./deploy/docker/frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Backend Web Service
  - type: web
    name: aurexis-backend
    plan: free
    runtime: docker
    dockerfilePath: ./deploy/docker/backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: aurexis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: aurexis-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # Key Value Service (Redis-compatible)
  - type: keyvalue
    name: aurexis-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

# Databases (Render Managed)
databases:
  - name: aurexis-postgres
    databaseName: jarvis
    user: jarvis
    plan: free
    # pgvector extension will be enabled via Alembic migration
    # Do not specify version in Blueprint - let migration handle it
