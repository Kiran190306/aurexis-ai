services:
  # Frontend Web Service
  - type: web
    name: aurexis-frontend
    plan: starter
    runtime: docker
    dockerfilePath: ./deploy/docker/frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      - key: VITE_API_URL
        sync: false # Set manually to backend URL (e.g., https://aurexis-backend.onrender.com)

  # Backend Web Service
  - type: web
    name: aurexis-backend
    plan: standard
    runtime: docker
    dockerfilePath: ./deploy/docker/backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: aurexis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # Set to frontend URL (e.g., https://aurexis-frontend.onrender.com)
      - key: ALLOWED_HOSTS
        sync: false # Set to backend URL (e.g., aurexis-backend.onrender.com)

  # Celery Worker Service
  - type: worker
    name: aurexis-celery-worker
    plan: standard
    runtime: docker
    dockerfilePath: ./deploy/docker/backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker worker --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurexis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: SECRET_KEY
      - key: ADMIN_PASSWORD
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: ADMIN_PASSWORD
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: OPENAI_API_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: ANTHROPIC_API_KEY
      - key: GOOGLE_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: GOOGLE_API_KEY

  # Celery Beat Service
  - type: worker
    name: aurexis-celery-beat
    plan: starter
    runtime: docker
    dockerfilePath: ./deploy/docker/backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.worker beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurexis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aurexis-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: SECRET_KEY
      - key: ADMIN_PASSWORD
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: ADMIN_PASSWORD
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: OPENAI_API_KEY
      - key: ANTHROPIC_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: ANTHROPIC_API_KEY
      - key: GOOGLE_API_KEY
        fromService:
          type: web
          name: aurexis-backend
          envVarKey: GOOGLE_API_KEY

  # Key Value Service (Redis-compatible)
  - type: keyvalue
    name: aurexis-redis
    plan: standard
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

# Databases (Render Managed)
databases:
  - name: aurexis-postgres
    databaseName: jarvis
    user: jarvis
    plan: standard
    # pgvector extension will be enabled via Alembic migration
    # Do not specify version in Blueprint - let migration handle it
