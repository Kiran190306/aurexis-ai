services:
  # Frontend Web Service
  - type: web
    name: jarvis-frontend
    plan: starter # Can be upgraded to standard/pro
    buildCommand: npm install && npm run build
    startCommand: nginx -g daemon off;
    dockerContext: frontend
    dockerfilePath: deploy/docker/frontend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: VITE_API_URL
        sync: false # Set manually to backend URL

  # Backend Web Service
  - type: web
    name: jarvis-backend
    env: python
    plan: standard # Can be upgraded to pro
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    dockerContext: backend
    dockerfilePath: deploy/docker/backend/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PORT
        sync: false # Render provides PORT
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jarvis-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: jarvis-redis
          property: password
      - key: CELERY_BROKER_URL
        generateValue: true # Will be set via script or manual
      - key: CELERY_RESULT_BACKEND
        generateValue: true # Will be set via script or manual
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # Set to frontend URL
      - key: ALLOWED_HOSTS
        sync: false # Set to backend URL

  # Celery Worker Service
  - type: worker
    name: jarvis-celery-worker
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker worker --loglevel=info
    dockerContext: backend
    dockerfilePath: deploy/docker/backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jarvis-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: jarvis-redis
          property: password
      - key: CELERY_BROKER_URL
        generateValue: true
      - key: CELERY_RESULT_BACKEND
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Celery Beat Service
  - type: worker
    name: jarvis-celery-beat
    env: python
    plan: starter # Can use smaller instance
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker beat --loglevel=info
    dockerContext: backend
    dockerfilePath: deploy/docker/backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jarvis-redis
          property: connectionString
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: jarvis-redis
          property: password
      - key: CELERY_BROKER_URL
        generateValue: true
      - key: CELERY_RESULT_BACKEND
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # Migration Job (One-time - manual trigger)
  - type: cron
    name: jarvis-migrations
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head
    dockerContext: backend
    dockerfilePath: deploy/docker/backend/Dockerfile
    schedule: "0 0 * * *" # Daily - disable after first run or use manual trigger
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-postgres
          property: connectionString

# Databases (Render Managed)
databases:
  - name: jarvis-postgres
    databaseName: jarvis
    user: jarvis
    plan: standard # Can be upgraded to pro
    extensions:
      - name: pgvector
        version: "0.5.0"

# Redis (Render Managed)
redis:
  - name: jarvis-redis
    plan: standard # Can be upgraded to pro
    maxmemoryPolicy: allkeys-lru
    # Render Redis is private by default, no ipallow needed
