apiVersion: batch/v1
kind: Job
metadata:
  name: jarvis-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: jarvis-ai/backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: jarvis-secrets
