apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
type: Opaque
stringData:
  # Example only. Populate from a secure secret-management system; do not apply
  # literal placeholders. Uppercase keys make envFrom safe for the API and Job.
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "${POSTGRES_DB}"
  DATABASE_URL: "${DATABASE_URL}"
  REDIS_URL: "${REDIS_URL}"
  SECRET_KEY: "${SECRET_KEY}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
